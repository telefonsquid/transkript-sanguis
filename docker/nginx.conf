server {
	listen 3000;
	server_name _;
	root /usr/share/nginx/html;

	# The app never sends health data, but request logs would still record who opened it
	access_log off;

	gzip on;
	gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/markdown;

	# Hashed build files never change
	location /_app/immutable/ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	# Browsers must see a new service worker right after a deploy
	location = /service-worker.js {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache" always;
	}

	location ~ \.md$ {
		include /etc/nginx/snippets/security-headers.conf;
		default_type text/markdown;
		charset utf-8;
	}

	# Every route is rendered in the browser from the single page fallback
	location / {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/ /200.html;
	}
}
