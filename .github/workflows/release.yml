# Builds the desktop app for every OS and arch and attaches the bundles to a draft GitHub release.
# Publish flow in CLAUDE.md "Releasing": changelog section, `bun run version:set <version>`, commit, push a tag like v0.1.0.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Parallel builds each open their own draft when none exists yet, so one job opens it first
  release:
    name: Create the draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      # Installers named after the wrong release are worse than a failed build
      - name: Check the tag against the app version
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match package.json $version"
            echo "run: bun run version:set $version"
            exit 1
          fi

      # Same text as the app's /changelog page, fails when the tag has no section
      - name: Read release notes from the changelog
        run: |
          bun run --silent release-notes "${{ github.ref_name }}" > notes.md
          cat >> notes.md <<'EOF'

          ---

          <!-- downloads -->
          <!-- /downloads -->

          > **Windows** – Not sure what to pick? Take **Portable** in the x64 column, it runs without installing anything.

          > **macOS** – Builds are unsigned: right-click the app and choose Open on first launch, or macOS refuses it outright.
          EOF

      # A rerun picks up the draft of the first run instead of opening another
      - name: Create the draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "map(select(.tag_name == \"$TAG\"))[0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="Transkript Sanguis $TAG" -F draft=true -F body=@notes.md --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            # MSI and NSIS installers, the bare exe goes up as portable below
            args: --target x86_64-pc-windows-msvc
            portable: x64
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            # WiX cannot build ARM64 MSIs, so NSIS only
            args: --target aarch64-pc-windows-msvc --bundles nsis
            portable: arm64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            # No updater bundle, the app only links to new releases (src/lib/update.ts)
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      # The AppImage bundler needs xdg-open for the opener plugin, the ARM image lacks it
      - name: Install Linux system dependencies
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xdg-utils

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}

      # The installers wrap this same exe, which runs on its own as the portable version
      - name: Upload portable exe
        if: startsWith(matrix.name, 'windows')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dest = "transkript-sanguis_${version}_windows_${{ matrix.portable }}_portable.exe"
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/transkript-sanguis.exe" $dest
          gh release upload "${{ github.ref_name }}" $dest --clobber

  # Each bundler names its output its own way, one pass over the finished release evens them out.
  # Runs after failed builds too, so a partial release still reads as one set.
  rename:
    name: Normalise asset names and link downloads
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Give every asset the same version_os_arch name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run rename-release-assets "${{ github.ref_name }}"

      # GitHub folds most assets away, badges in the notes keep every file in view.
      # Runs after a failed rename too, files it could not name just get no badge.
      - name: Link every download in the release notes
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release-downloads "${{ github.ref_name }}"
