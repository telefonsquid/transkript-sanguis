[package]
name = "transkript-sanguis"
version = "0.1.0"
description = "Blood test results over time next to researched reference ranges"
authors = ["Saskia Henkys"]
license = "MIT"
edition = "2021"

[lib]
# The _lib suffix keeps the lib name apart from the bin name, which clashes on Windows (rust-lang/cargo#8519)
name = "transkript_sanguis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
percent-encoding = "2"

# Only for the taskbar icon, see taskbar_icon in src/lib.rs
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
